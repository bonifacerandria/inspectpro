# Nom de projet explicite -> volumes/réseaux préfixés "inspectpro_..."
# aucune collision possible avec taskflow-*, moodle-*, epay-php déjà en place.
name: inspectpro

services:
  app:
    build:
      context: ./laravel-setup
      dockerfile: docker/php/Dockerfile
    container_name: inspectpro-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./laravel-setup:/var/www/html
      - storage_data:/var/www/html/storage/app
      # Laravel a besoin d'un vrai FICHIER .env à la racine du projet
      # (certaines commandes, comme "artisan key:generate", l'éditent
      # directement sur disque) — env_file seul ne suffit pas, il n'injecte
      # que des variables d'environnement au process, sans créer de fichier.
      - ./backend.env:/var/www/html/.env
    env_file: ./backend.env
    depends_on: [db]
    networks: [inspectpro-net]

  backend-webserver:
    image: nginx:1.27-alpine
    container_name: inspectpro-backend-nginx
    restart: unless-stopped
    volumes:
      - ./laravel-setup:/var/www/html
      - ./laravel-setup/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      # Ports déjà occupés sur ce VM : 3000, 3001, 3100, 8080, 8090, 9000,
      # 9090, 9093, 9100, 9187, 5432, 3306 (cf. `docker ps`). 8081 est libre.
      - "127.0.0.1:8081:80"
    depends_on: [app]
    networks: [inspectpro-net]

  db:
    image: postgres:16-alpine
    container_name: inspectpro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [inspectpro-net]
    # Pas de "ports:" -> aucun conflit possible avec taskflow-db (déjà sur
    # le 5432 hôte) puisque ce Postgres n'est jamais exposé à l'hôte ; seul
    # "app" l'atteint via le réseau docker interne (hostname "db", port
    # 5432 *interne au conteneur*, sans rapport avec le 5432 déjà pris).

volumes:
  pgdata:
  storage_data:

networks:
  inspectpro-net:
    driver: bridge
