version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: inspection-levage-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage/app
    env_file: .env
    depends_on:
      - db
    networks:
      - inspection-net

  webserver:
    image: nginx:1.27-alpine
    container_name: inspection-levage-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - inspection-net

  db:
    image: postgres:16-alpine
    container_name: inspection-levage-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inspection_levage
      POSTGRES_USER: inspection_user
      POSTGRES_PASSWORD: change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # à retirer en prod si accès externe non nécessaire
    networks:
      - inspection-net

volumes:
  pgdata:
  storage_data:

networks:
  inspection-net:
    driver: bridge
